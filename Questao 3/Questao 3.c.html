<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bandeiras super fodasticas</title>
        <style>
            * {
                padding: 0px;
                margin: 0px;
            }
            body {
                background-color: black;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .bandeira {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 400px;
                width: 700px;
                background-color: white;
            } 
            .circulo {
                height: 170px;
                width: 170px;
                background-color: red;
                border-radius: 50%;
            }
        </style>
    </head>
    <body>
        <div class="bandeira">
            <div class="circulo"></div>
        </div>
    </body>
</html>
