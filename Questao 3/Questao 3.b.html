<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bandeiras super fodasticas</title>
        <style>
            * {
                padding: 0px;
                margin: 0px;
            }
            body {
                background-color: lightgrey;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .bandeira {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                height: 400px;
                width: 700px;
                background-color: white;
            }    
            .faixa-um {
                height: 33.3%;
                width: 100%;
                background-color: black;
            }
            .faixa-dois {
                height: 33.3%;
                width: 100%;
                background-color: red;
            }
            .faixa-tres {
                height: 33.3%;
                width: 100%;
                background-color: yellow;
            }
        </style>
    </head>
    <body>
        <div class="bandeira">
            <div class="faixa-um"></div>
            <div class="faixa-dois"></div>
            <div class="faixa-tres"></div>
        </div>
    </body>
</html>
